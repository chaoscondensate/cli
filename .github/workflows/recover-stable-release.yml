name: Recover stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to recover
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: recover-stable-release
  cancel-in-progress: false

jobs:
  recover:
    name: Packages, Homebrew formula, and attestations
    runs-on: windows-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify current stable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Recovery only accepts stable SemVer tags." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RECOVERY_TAG")" != "tag" ]]; then
            echo "Recovery requires an annotated tag." >&2
            exit 1
          fi
          latest_tag="$(gh api repos/chaoscondensate/cli/releases/latest --jq '.tag_name')"
          if [[ "$RECOVERY_TAG" != "$latest_tag" ]]; then
            echo "$RECOVERY_TAG is not the current latest stable release ($latest_tag)." >&2
            exit 1
          fi

      - name: Verify Homebrew tap access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required." >&2
            exit 1
          fi
          if [[ "$(gh api repos/chaoscondensate/homebrew-tap --jq '.permissions.push')" != "true" ]]; then
            echo "HOMEBREW_TAP_TOKEN cannot write to chaoscondensate/homebrew-tap." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Cosign for GoReleaser verification
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Generate release metadata without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --skip=publish

      - name: Download published checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist/published
          gh release download "$RECOVERY_TAG" \
            --repo chaoscondensate/cli \
            --pattern checksums.txt \
            --dir dist/published

      - name: Bind Chocolatey package to published Windows archive
        shell: pwsh
        env:
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          $packages = @(Get-ChildItem -Path dist -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected one generated Chocolatey package, found $($packages.Count)."
          }
          $version = $env:RECOVERY_TAG.Substring(1)
          $archiveName = "forecast-ledger_${version}_windows_x86_64.zip"
          $escapedArchiveName = [regex]::Escape($archiveName)
          $checksumLines = @(Get-Content dist/published/checksums.txt | Where-Object {
            $_ -match "^[0-9a-fA-F]{64}\s+$escapedArchiveName$"
          })
          if ($checksumLines.Count -ne 1) {
            throw "Expected one checksum for $archiveName, found $($checksumLines.Count)."
          }
          $publishedChecksum = ($checksumLines[0] -split '\s+')[0].ToLowerInvariant()

          $work = New-Item -ItemType Directory -Force dist/chocolatey-repack
          $zipPath = Join-Path $work.FullName package.zip
          $unpackedPath = Join-Path $work.FullName unpacked
          $stagingPath = Join-Path $work.FullName staging
          Copy-Item $packages[0].FullName $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $unpackedPath
          New-Item -ItemType Directory -Force $stagingPath | Out-Null
          Copy-Item (Join-Path $unpackedPath forecast-ledger.nuspec) $stagingPath
          Copy-Item (Join-Path $unpackedPath tools) $stagingPath -Recurse
          $installScript = Join-Path $stagingPath tools/chocolateyinstall.ps1
          $content = Get-Content -Raw $installScript
          $pattern = "(checksum64\s*=\s*')[0-9a-fA-F]{64}(')"
          if ([regex]::Matches($content, $pattern).Count -ne 1) {
            throw "Expected exactly one checksum64 entry in the Chocolatey install script."
          }
          $replacement = '${1}' + $publishedChecksum + '${2}'
          [regex]::Replace($content, $pattern, $replacement) |
            Set-Content -NoNewline -Encoding utf8 $installScript

          $repacked = New-Item -ItemType Directory -Force dist/repacked-chocolatey
          Push-Location $stagingPath
          try {
            choco pack forecast-ledger.nuspec --outputdirectory $repacked.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Could not repack the Chocolatey package."
            }
          } finally {
            Pop-Location
          }
          if (@(Get-ChildItem -Path $repacked.FullName -Filter *.nupkg).Count -ne 1) {
            throw "Expected exactly one repacked Chocolatey package."
          }

      - name: Publish or verify Chocolatey package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          function Get-PackageChecksum([string]$PackagePath, [string]$InspectName) {
            $inspectRoot = Join-Path dist $InspectName
            New-Item -ItemType Directory -Force $inspectRoot | Out-Null
            tar -xf $PackagePath -C $inspectRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Could not extract $PackagePath."
            }
            $content = Get-Content -Raw (Join-Path $inspectRoot tools/chocolateyinstall.ps1)
            $match = [regex]::Match($content, "checksum64\s*=\s*'(?<checksum>[0-9a-fA-F]{64})'")
            if (-not $match.Success) {
              throw "Could not read checksum64 from $PackagePath."
            }
            return $match.Groups['checksum'].Value.ToLowerInvariant()
          }

          function Test-PackageLayout([string]$PackagePath) {
            $entries = @(tar -tf $PackagePath)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not list $PackagePath."
            }
            $relationships = @($entries | Where-Object { $_ -eq '_rels/.rels' }).Count
            $contentTypes = @($entries | Where-Object { $_ -eq '[Content_Types].xml' }).Count
            return $relationships -eq 1 -and $contentTypes -eq 1
          }

          $packages = @(Get-ChildItem -Path dist/repacked-chocolatey -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected one corrected Chocolatey package, found $($packages.Count)."
          }
          $package = $packages[0]
          $version = $env:RECOVERY_TAG.Substring(1)
          $archiveName = "forecast-ledger_${version}_windows_x86_64.zip"
          $escapedArchiveName = [regex]::Escape($archiveName)
          $checksumLine = @(Get-Content dist/published/checksums.txt | Where-Object {
            $_ -match "^[0-9a-fA-F]{64}\s+$escapedArchiveName$"
          })
          $publishedChecksum = ($checksumLine[0] -split '\s+')[0].ToLowerInvariant()
          $release = gh api "repos/chaoscondensate/cli/releases/tags/$env:RECOVERY_TAG" | ConvertFrom-Json
          $asset = @($release.assets | Where-Object name -eq $package.Name)
          if ($asset.Count -eq 0) {
            gh release upload $env:RECOVERY_TAG $package.FullName --repo chaoscondensate/cli
            if ($LASTEXITCODE -ne 0) {
              throw "Could not attach the Chocolatey package to the GitHub Release."
            }
          } elseif ($asset.Count -eq 1) {
            New-Item -ItemType Directory -Force dist/current-chocolatey | Out-Null
            gh release download $env:RECOVERY_TAG --repo chaoscondensate/cli --pattern $package.Name --dir dist/current-chocolatey
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download the current Chocolatey package."
            }
            $currentPackage = @(Get-ChildItem -Path dist/current-chocolatey -Filter *.nupkg)[0]
            $currentChecksum = Get-PackageChecksum $currentPackage.FullName current-chocolatey-inspect
            if ($currentChecksum -ne $publishedChecksum -or -not (Test-PackageLayout $currentPackage.FullName)) {
              gh release upload $env:RECOVERY_TAG $package.FullName --repo chaoscondensate/cli --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "Could not replace the invalid Chocolatey package."
              }
            }
          } else {
            throw "The GitHub Release contains more than one matching Chocolatey package."
          }
          New-Item -ItemType Directory -Force dist/published-chocolatey | Out-Null
          gh release download $env:RECOVERY_TAG --repo chaoscondensate/cli --pattern $package.Name --dir dist/published-chocolatey
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the published Chocolatey package."
          }
          if (@(Get-ChildItem -Path dist/published-chocolatey -Filter *.nupkg).Count -ne 1) {
            throw "Expected exactly one published Chocolatey package."
          }
          $publishedPackage = @(Get-ChildItem -Path dist/published-chocolatey -Filter *.nupkg)[0]
          if ((Get-PackageChecksum $publishedPackage.FullName published-chocolatey-inspect) -ne $publishedChecksum) {
            throw "The published Chocolatey package does not match the published Windows archive checksum."
          }
          if (-not (Test-PackageLayout $publishedPackage.FullName)) {
            throw "The published Chocolatey package contains duplicate package metadata entries."
          }

      - name: Attest Chocolatey package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/published-chocolatey/*.nupkg

      - name: Smoke-test Chocolatey package
        shell: pwsh
        env:
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          $source = (Resolve-Path dist/published-chocolatey).Path
          $version = $env:RECOVERY_TAG.Substring(1)
          choco install forecast-ledger --source $source --version $version --yes --no-progress
          forecast-ledger version --json
          choco uninstall forecast-ledger --yes --no-progress

      - name: Check out current release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Generate formula from published archive digests
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          .release-automation/scripts/render-homebrew-formula.sh \
            "$RECOVERY_TAG" \
            dist/published/checksums.txt \
            dist/homebrew/Formula/forecast-ledger.rb

      - name: Publish Homebrew formula
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          formula_path="Formula/forecast-ledger.rb"
          formula_file="dist/homebrew/$formula_path"
          content="$(base64 -w 0 "$formula_file")"
          existing_sha="$(gh api "repos/chaoscondensate/homebrew-tap/contents/$formula_path" --jq '.sha' 2>/dev/null || true)"
          arguments=(
            --method PUT
            "repos/chaoscondensate/homebrew-tap/contents/$formula_path"
            -f "message=chore: update forecast-ledger to $RECOVERY_TAG"
            -f branch=main
            -f "content=$content"
          )
          if [[ -n "$existing_sha" ]]; then
            arguments+=(-f "sha=$existing_sha")
          fi
          gh api "${arguments[@]}" --silent

          cask_path="Casks/forecast-ledger.rb"
          cask_sha="$(gh api "repos/chaoscondensate/homebrew-tap/contents/$cask_path" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$cask_sha" ]]; then
            gh api --method DELETE \
              "repos/chaoscondensate/homebrew-tap/contents/$cask_path" \
              -f "message=chore: replace forecast-ledger cask with formula" \
              -f branch=main \
              -f "sha=$cask_sha" \
              --silent
          fi

      - name: Attest published release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/published/checksums.txt
