name: OpenTimestamps liveness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ots-liveness
  cancel-in-progress: false

jobs:
  public-profile:
    name: Fixed public calendar profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check fixed calendar threshold
        env:
          FORECAST_LEDGER_OTS_LIVENESS: "1"
        run: go test ./internal/timestamp/ots -run '^TestPublicProfileLiveness$' -count=1 -v
