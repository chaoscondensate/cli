name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Dependency vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Analyze reachable vulnerabilities
        run: go tool govulncheck ./...

  release:
    name: GoReleaser
    needs: security
    runs-on: windows-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require an annotated SemVer tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use SemVer, for example v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "${GITHUB_REF}")" != "tag" ]]; then
            echo "Release tags must be annotated tags." >&2
            exit 1
          fi

      - name: Require public release documents
        shell: bash
        run: |
          for file in CITATION.cff LICENSE README.md; do
            if [[ ! -f "$file" ]]; then
              echo "$file is required before a public release." >&2
              exit 1
            fi
          done

      - name: Verify Homebrew tap access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required." >&2
            exit 1
          fi
          if [[ "$(gh api repos/chaoscondensate/homebrew-tap --jq '.permissions.push')" != "true" ]]; then
            echo "HOMEBREW_TAP_TOKEN cannot write to chaoscondensate/homebrew-tap." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release citation metadata
        shell: bash
        run: |
          release_date="$(git for-each-ref --format='%(taggerdate:short)' "refs/tags/$GITHUB_REF_NAME")"
          if [[ -z "$release_date" ]]; then
            echo "Could not read the annotated tag date for $GITHUB_REF_NAME." >&2
            exit 1
          fi
          go run ./tools/citationcheck \
            --version "${GITHUB_REF_NAME#v}" \
            --date "$release_date"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Cosign for GoReleaser verification
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh api "repos/chaoscondensate/cli/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the published GitHub Release."
          }
          $assets = @{}
          foreach ($asset in $release.assets) {
            if ($assets.ContainsKey($asset.name)) {
              throw "The GitHub Release contains duplicate asset name $($asset.name)."
            }
            $assets[$asset.name] = $asset
          }
          foreach ($line in Get-Content dist/checksums.txt) {
            if ($line -notmatch '^(?<digest>[0-9a-fA-F]{64})\s+(?<name>.+)$') {
              throw "Invalid checksum entry: $line"
            }
            $name = $Matches.name
            $digest = $Matches.digest.ToLowerInvariant()
            if (-not $assets.ContainsKey($name)) {
              throw "Published GitHub Release is missing checksummed asset $name."
            }
            if ($assets[$name].digest -ne "sha256:$digest") {
              throw "Published digest does not match checksums.txt for $name."
            }
          }

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish Chocolatey package to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = @(Get-ChildItem -Path dist -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected one Chocolatey package, found $($packages.Count)."
          }
          gh release upload $env:GITHUB_REF_NAME $packages[0].FullName --repo chaoscondensate/cli
          if ($LASTEXITCODE -ne 0) {
            throw "Could not attach the Chocolatey package to the GitHub Release."
          }

      - name: Attest Chocolatey package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.nupkg

      - name: Smoke-test Chocolatey package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = @(Get-ChildItem -Path dist -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected one Chocolatey package, found $($packages.Count)."
          }
          $release = gh api "repos/chaoscondensate/cli/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          if ($release.assets.name -notcontains $packages[0].Name) {
            throw "The Chocolatey package was not attached to the GitHub Release."
          }
          $source = (Resolve-Path dist).Path
          $version = $env:GITHUB_REF_NAME.Substring(1)
          choco install forecast-ledger --source $source --version $version --yes --no-progress
          forecast-ledger version --json
          choco uninstall forecast-ledger --yes --no-progress

      - name: Generate Homebrew formula
        id: homebrew
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the stable Homebrew formula for prerelease $GITHUB_REF_NAME."
            exit 0
          fi
          scripts/render-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist/checksums.txt \
            dist/homebrew/Formula/forecast-ledger.rb
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        if: steps.homebrew.outputs.publish == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: chaoscondensate/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: dist/homebrew-tap

      - name: Publish Homebrew formula
        if: steps.homebrew.outputs.publish == 'true'
        shell: bash
        run: |
          cp dist/homebrew/Formula/forecast-ledger.rb \
            dist/homebrew-tap/Formula/forecast-ledger.rb
          rm -f dist/homebrew-tap/Casks/forecast-ledger.rb
          git -C dist/homebrew-tap config user.name github-actions[bot]
          git -C dist/homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C dist/homebrew-tap add --all
          if git -C dist/homebrew-tap diff --cached --quiet; then
            echo "Homebrew formula is already current."
          else
            git -C dist/homebrew-tap commit -m "chore: update forecast-ledger to $GITHUB_REF_NAME"
            git -C dist/homebrew-tap push origin HEAD:main
          fi
