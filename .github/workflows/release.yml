name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require an annotated SemVer tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use SemVer, for example v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "${GITHUB_REF}")" != "tag" ]]; then
            echo "Release tags must be annotated tags." >&2
            exit 1
          fi

      - name: Require public release documents
        shell: bash
        run: |
          for file in LICENSE README.md; do
            if [[ ! -f "$file" ]]; then
              echo "$file is required before a public release." >&2
              exit 1
            fi
          done

      - name: Verify Homebrew tap access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required." >&2
            exit 1
          fi
          if [[ "$(gh api repos/chaoscondensate/homebrew-tap --jq '.permissions.push')" != "true" ]]; then
            echo "HOMEBREW_TAP_TOKEN cannot write to chaoscondensate/homebrew-tap." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Cosign for GoReleaser verification
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Generate Homebrew formula
        id: homebrew
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the stable Homebrew formula for prerelease $GITHUB_REF_NAME."
            exit 0
          fi
          scripts/render-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            dist/checksums.txt \
            dist/homebrew/Formula/forecast-ledger.rb
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish Homebrew formula
        if: steps.homebrew.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          formula_path="Formula/forecast-ledger.rb"
          formula_file="dist/homebrew/$formula_path"
          content="$(base64 -w 0 "$formula_file")"
          existing_sha="$(gh api "repos/chaoscondensate/homebrew-tap/contents/$formula_path" --jq '.sha' 2>/dev/null || true)"
          arguments=(
            --method PUT
            "repos/chaoscondensate/homebrew-tap/contents/$formula_path"
            -f "message=chore: update forecast-ledger to $GITHUB_REF_NAME"
            -f branch=main
            -f "content=$content"
          )
          if [[ -n "$existing_sha" ]]; then
            arguments+=(-f "sha=$existing_sha")
          fi
          gh api "${arguments[@]}" --silent

          cask_path="Casks/forecast-ledger.rb"
          cask_sha="$(gh api "repos/chaoscondensate/homebrew-tap/contents/$cask_path" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$cask_sha" ]]; then
            gh api --method DELETE \
              "repos/chaoscondensate/homebrew-tap/contents/$cask_path" \
              -f "message=chore: replace forecast-ledger cask with formula" \
              -f branch=main \
              -f "sha=$cask_sha" \
              --silent
          fi

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt
