name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race detector
        if: runner.os != 'Windows'
        run: go test -race ./internal/storage ./internal/service ./internal/timestamp/rfc3161 ./internal/adapters/mcp

  native-smoke:
    name: Native command smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and smoke-test the native binary
        shell: bash
        run: |
          binary="$RUNNER_TEMP/forecast-ledger"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          go build -mod=readonly -trimpath -o "$binary" ./cmd/forecast-ledger
          "$binary" version --json
          "$binary" --help
          for group in ledger platform question forecast target timestamp publish mcp; do
            "$binary" "$group" --help
          done
          "$binary" verify --help

      - name: Run native dogfood lifecycle
        shell: bash
        run: bash scripts/dogfood.sh "$RUNNER_TEMP/forecast-ledger${{ runner.os == 'Windows' && '.exe' || '' }}"

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            printf 'These files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check generated operation contracts
        shell: bash
        run: |
          go generate ./internal/service
          git diff --exit-code -- docs/reference/generated

      - name: Check maintained documentation and links
        run: go test ./internal/doccheck

      - name: Check documented command examples and help
        run: go test ./internal/adapters/cli -run 'Test(HelpSuggestionsCompletionAndVersionJSON|EveryVisibleLeafHasARealAction|.*Help.*Golden)'

      - name: Check secret redaction canaries
        run: go test ./internal/service ./internal/adapters/cli ./internal/adapters/mcp -run '(Secret|Redact|Protected|PublicationBuild|SealedDoesNotLeak)'

      - name: Check plain English terms
        shell: bash
        run: |
          if rg -n -i '\b(utilize|utilizes|utilized|synergize|leveraging|aforementioned|hereinafter)\b' README.md docs AGENTS.md; then
            echo 'Use short, plain English in public documentation.' >&2
            exit 1
          fi

      - name: Check generated tree is clean
        shell: bash
        run: git diff --exit-code

  security:
    name: Dependency vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Analyze reachable vulnerabilities
        run: go tool govulncheck ./...

  snapshot:
    name: GoReleaser snapshot
    needs:
      - format
      - security
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean --skip=publish,chocolatey

      - name: Verify release package matrix
        shell: bash
        run: |
          jq -e '[.[] | select(.type == "Archive")] | length == 6' dist/artifacts.json
          jq -e '[.[] | select(.type == "Linux Package")] | length == 8' dist/artifacts.json
          jq -e '[.[] | select(.type == "SBOM")] | length == 14' dist/artifacts.json
          if grep -F '~' dist/checksums.txt; then
            echo "Release filenames must not contain characters GitHub normalizes." >&2
            exit 1
          fi
          while read -r digest name; do
            if [[ ! -f "dist/$name" ]]; then
              echo "Checksum entry does not name a built artifact: $name" >&2
              exit 1
            fi
          done < dist/checksums.txt

      - name: Smoke-test Debian package
        shell: bash
        run: |
          package="$(find dist -maxdepth 1 -name '*_amd64.deb' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "The amd64 Debian package is missing." >&2
            exit 1
          fi
          sudo apt-get install -y "$PWD/$package"
          forecast-ledger version --json
          forecast-ledger --help
          for group in ledger platform question forecast target timestamp publish mcp; do
            forecast-ledger "$group" --help
          done
          forecast-ledger verify --help
          test -f /usr/share/licenses/forecast-ledger/LICENSE
          sudo apt-get remove -y forecast-ledger
          test ! -e /usr/bin/forecast-ledger

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: forecast-ledger-snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows-package:
    name: Chocolatey snapshot
    needs:
      - format
      - security
      - test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Chocolatey CLI
        shell: pwsh
        run: choco --version

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Build Chocolatey snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean --skip=publish

      - name: Verify Windows release snapshot
        shell: pwsh
        run: |
          $artifacts = Get-Content dist/artifacts.json | ConvertFrom-Json
          if (@($artifacts | Where-Object type -eq 'Archive').Count -ne 6) {
            throw 'Expected six archives.'
          }
          if (@($artifacts | Where-Object type -eq 'Linux Package').Count -ne 8) {
            throw 'Expected eight Linux packages.'
          }
          if (@($artifacts | Where-Object type -eq 'SBOM').Count -ne 14) {
            throw 'Expected fourteen SBOMs.'
          }
          if (@(Get-ChildItem -Path dist -Filter *.nupkg).Count -ne 1) {
            throw 'Expected one Chocolatey package.'
          }

      - name: Upload Chocolatey snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: forecast-ledger-chocolatey-snapshot
          path: dist/*.nupkg
          if-no-files-found: error
          retention-days: 7
