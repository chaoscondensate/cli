name: Bug report
description: Report reproducible incorrect behavior in Forecast Ledger CLI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Forecast Ledger CLI.

        Do not include protected keys, credentials, salts, private ledgers, unrevealed forecasts, personal data, or proprietary material. Use a minimal synthetic ledger and redact local paths. Report suspected vulnerabilities through [GitHub Private Vulnerability Reporting](https://github.com/chaoscondensate/cli/security/advisories/new), not this public form.
  - type: input
    id: version_output
    attributes:
      label: Version
      description: Paste the release and commit from `forecast-ledger version --json`.
      placeholder: 'For example: {"version":"v0.1.1", ...}'
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
        - Other
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Installation method
      description: State whether you used Homebrew, a release archive, or a source build.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or MCP request
      description: Show the exact command or a redacted request. Never include a secret in argv or JSON.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give numbered steps and the smallest synthetic input that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted stdout, stderr, exit code, or MCP error when useful.
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add safe diagnostics, frequency, regression range, or related links.
  - type: checkboxes
    id: public_data_confirmation
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed keys, credentials, private ledger content, unrevealed forecasts, personal data, and other secrets.
          required: true
        - label: This is not a suspected undisclosed security vulnerability.
          required: true
