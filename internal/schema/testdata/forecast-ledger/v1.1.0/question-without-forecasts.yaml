    status: open
    resolution_criteria: Resolve YES if the event is publicly confirmed before 2027-01-01T00:00:00Z; otherwise resolve NO.
    created_at: "2026-08-29T09:05:00+01:00"
    forecast_window:
      closes_at: "2026-12-01T00:00:00Z"
    expected_resolution_at: "2027-01-01T00:00:00Z"
    notes: Waiting for assignment to a forecaster.
    forecasts: []
