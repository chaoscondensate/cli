version: 2

project_name: forecast-ledger

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: forecast-ledger
    main: ./cmd/forecast-ledger
    binary: forecast-ledger
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/chaoscondensate/cli/internal/buildinfo.version={{ .Version }}
      - -X github.com/chaoscondensate/cli/internal/buildinfo.sourceRevision={{ .Commit }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: forecast-ledger
    ids:
      - forecast-ledger
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  github:
    owner: chaoscondensate
    name: cli
  draft: false
  prerelease: auto
  footer: |
    ---

    Project context and updates: https://chaoscondensate.com/
